<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yusuf Khan · Portfolio Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: #F4F6F9;
    color: #0E2138;
  }
  .h-display { font-family: 'Bricolage Grotesque', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .canvas-iframe { width: 100%; height: 100%; border: none; display: block; background: white; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 99px; letter-spacing: .06em; text-transform: uppercase; }
  .open-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    background: #0E2138; color: white;
    font-size: 12.5px; font-weight: 700; text-decoration: none;
    border: none; cursor: pointer; font-family: inherit;
  }
  .open-btn:hover { background: #0070D2; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">

const { useState, useEffect } = React;

function Intro() {
  return (
    <div style={{
      padding: "56px 72px 32px",
      background: "linear-gradient(180deg, white 0%, #F4F6F9 100%)",
      borderBottom: "1px solid #E5E8EE",
    }}>
      <div className="mono" style={{ fontSize: 12, letterSpacing: ".18em", color: "#5E6886", textTransform: "uppercase", fontWeight: 700 }}>
        For · Yusuf Khan · Salesforce Lead Developer
      </div>
      <h1 className="h-display" style={{ fontSize: 64, lineHeight: 1, fontWeight: 800, margin: "16px 0 14px", letterSpacing: "-.025em" }}>
        Three takes on your portfolio.
      </h1>
      <p style={{ fontSize: 17, color: "#3E5879", maxWidth: 760, lineHeight: 1.55, margin: 0 }}>
        Same story — twelve certifications, three flagship projects, eight years on platform — told three ways.
        Click any artboard to open it fullscreen, or just scroll within the live preview. <strong style={{ color: "#0E2138" }}>Direction A</strong> (Trailhead-inspired) is the main multi-page prototype with all the techy wonders wired up.
      </p>
      <div style={{ display: "flex", gap: 10, marginTop: 22, flexWrap: "wrap" }}>
        <span className="pill" style={{ background: "rgba(0,161,224,.12)", color: "#0070D2" }}>● Direction A · Trailhead · live multi-page</span>
        <span className="pill" style={{ background: "rgba(193,107,46,.12)", color: "#C16B2E" }}>● Direction B · Architect blueprint</span>
        <span className="pill" style={{ background: "rgba(0,212,255,.12)", color: "#00B0DC" }}>● Direction C · Terminal / IDE</span>
      </div>
    </div>
  );
}

function ArtboardFrame({ src, openFull }) {
  return (
    <div style={{ position: "relative", width: "100%", height: "100%" }}>
      <iframe src={src} className="canvas-iframe" title={src}></iframe>
      <button onClick={openFull}
        style={{
          position: "absolute", top: 14, right: 14,
          background: "rgba(14,33,56,.92)", backdropFilter: "blur(8px)",
          color: "white", border: "none",
          padding: "8px 14px", borderRadius: 999, cursor: "pointer",
          fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", gap: 6,
          fontFamily: "inherit", boxShadow: "0 8px 20px -8px rgba(0,0,0,.4)",
        }}>
        Open full →
      </button>
    </div>
  );
}

function App() {
  // attach focus handlers to each artboard after mount via canvas's focus API
  // The design canvas has focus mode built-in; user can also click "Open full" to open in a new tab.

  return (
    <DesignCanvas
      preface={<Intro/>}
      initialZoom={.35}
      gap={120}
    >
      <DCSection id="directions" title="Three directions" subtitle="Compare side-by-side · open any fullscreen">

        <DCArtboard id="dir-a" label="A · Trailhead-inspired · main multi-page" width={1440} height={900}>
          <ArtboardFrame
            src="portfolio-trailhead.html"
            openFull={() => window.open("portfolio-trailhead.html", "_blank")}
          />
        </DCArtboard>

        <DCArtboard id="dir-b" label="B · Architect blueprint" width={1440} height={900}>
          <ArtboardFrame
            src="portfolio-blueprint.html"
            openFull={() => window.open("portfolio-blueprint.html", "_blank")}
          />
        </DCArtboard>

        <DCArtboard id="dir-c" label="C · Terminal / dev console" width={1440} height={900}>
          <ArtboardFrame
            src="portfolio-terminal.html"
            openFull={() => window.open("portfolio-terminal.html", "_blank")}
          />
        </DCArtboard>

      </DCSection>

      <DCSection id="notes" title="Notes" subtitle="What's where in the main direction">
        <DCArtboard id="features" label="Techy wonders included in Direction A" width={1100} height={780}>
          <div style={{ padding: 56, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, height: "100%", background: "white", overflow: "auto" }}>
            {[
              ["⚡", "Lightning bolt cursor trail", "A canvas-based bolt sprite trails your cursor + ambient particles drift in the background. Toggleable via the Tweaks panel."],
              ["💻", "Live Apex / SOQL typewriter", "Hero shows a live-typing Developer Console with syntax-highlighted Apex + a SOQL query."],
              ["📊", "Animated org-health dashboard", "Counters tick, sparkline updates, gauges shift every 1.5s — looks like a real org telemetry view."],
              ["🛤", "Trailhead-style skills trail", "Skills laid along a winding path with marker pins that label each station."],
              ["🎖", "3D rotating cert badges", "12 hexagonal badges with shine, hue per family, optional spin-all mode."],
              ["🔀", "Flow Builder–style diagram", "Each case study animates its own automation diagram with drawing edges + moving dots."],
              ["🪄", "Trail companion mascot", "An original cloud-and-bolt critter follows your cursor, waves on idle, and drops contextual tips per page."],
              ["🎛", "Tweaks panel", "Accent + deep-accent palette swatches, plus toggles for cursor, bolt trail and the mascot."],
            ].map(([icon, t, d]) => (
              <div key={t} style={{ padding: 20, background: "#F4F6F9", borderRadius: 14, border: "1px solid #E5E8EE" }}>
                <div style={{ fontSize: 28, marginBottom: 10 }}>{icon}</div>
                <strong className="h-display" style={{ fontSize: 18, display: "block", marginBottom: 6 }}>{t}</strong>
                <div style={{ color: "#3E5879", fontSize: 13.5, lineHeight: 1.5 }}>{d}</div>
              </div>
            ))}
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
